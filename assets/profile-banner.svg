<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">eachboy — student developer</title>
  <desc id="d">Profile banner: eachboy, student developer. TypeScript, React, Rust, Tauri.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb9a8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="280" fill="url(#accent)"/>

  <!-- terminal-style prompt -->
  <text x="72" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="22" fill="#6e7681">~/portfolio $ whoami</text>

  <text x="72" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-1">eachboy</text>

  <rect x="72" y="184" width="96" height="4" rx="2" fill="url(#accent)"/>

  <text x="72" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#9da7b3">Student developer · open to internships and junior roles</text>

  <!-- stack line, right aligned -->
  <text x="1128" y="92" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#58a6ff">TypeScript · React · Rust · Tauri</text>
</svg>
